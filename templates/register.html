{% extends 'base.html' %}

{% block title %}Registro - Perretes{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1>🚀 Crea tu cuenta</h1>
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="tu_usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8" placeholder="Mínimo 8 caracteres">
            </div>
            <div class="form-group">
                <label>Elige tu avatar</label>
                <div class="avatar-selector" id="avatar-selector">
                    <button type="button" class="avatar-option active" data-value="1" style="background:#FF6B6B">🐶</button>
                    <button type="button" class="avatar-option" data-value="2" style="background:#4ECDC4">🐱</button>
                    <button type="button" class="avatar-option" data-value="3" style="background:#FF9F43">🦊</button>
                    <button type="button" class="avatar-option" data-value="4" style="background:#A29BFE">🐼</button>
                    <button type="button" class="avatar-option" data-value="5" style="background:#FD79A8">🐨</button>
                    <button type="button" class="avatar-option" data-value="6" style="background:#FDCB6E">🐯</button>
                    <button type="button" class="avatar-option" data-value="7" style="background:#6C5CE7">🦁</button>
                    <button type="button" class="avatar-option" data-value="8" style="background:#00B894">🐰</button>
                </div>
                <input type="hidden" id="avatar-choice" name="avatar_choice" value="1">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="register-btn">
                <span class="btn-text">Registrarme</span>
                <span class="spinner hidden"></span>
            </button>
            <div id="register-errors" class="errors"></div>
        </form>
        <p class="auth-link">¿Ya tienes cuenta? <a href="/login/">Inicia sesión</a></p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    (function() {
        initAuthNav();
        const form = document.getElementById('register-form');
        const btn = document.getElementById('register-btn');
        const errorsDiv = document.getElementById('register-errors');
        const avatarSelector = document.getElementById('avatar-selector');
        const avatarInput = document.getElementById('avatar-choice');

        if (avatarSelector) {
            avatarSelector.querySelectorAll('.avatar-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    avatarSelector.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    avatarInput.value = opt.dataset.value;
                });
            });
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            setLoading(btn, true);
            errorsDiv.innerHTML = '';

            const data = {
                username: form.username.value.trim(),
                password: form.password.value,
                avatar_choice: parseInt(avatarInput.value, 10) || 1,
            };

            try {
                const result = await apiPost('/api/users/register/', data);
                showToast('¡Cuenta creada! Bienvenido, ' + result.user.username);
                window.location.href = '/';
            } catch (err) {
                renderErrors(errorsDiv, err.errors || { general: err.message || 'Error al registrarse.' });
            } finally {
                setLoading(btn, false);
            }
        });
    })();
</script>
{% endblock %}
