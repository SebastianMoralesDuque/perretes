{% extends 'base.html' %}

{% block title %}Login - Perretes{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1>👋 Bienvenido de nuevo</h1>
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="tu_usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                <span class="btn-text">Entrar</span>
                <span class="spinner hidden"></span>
            </button>
            <div id="login-errors" class="errors"></div>
        </form>
        <p class="auth-link">¿No tienes cuenta? <a href="/registro/">Regístrate</a></p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    (function() {
        initAuthNav();
        const form = document.getElementById('login-form');
        const btn = document.getElementById('login-btn');
        const errorsDiv = document.getElementById('login-errors');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            setLoading(btn, true);
            errorsDiv.innerHTML = '';

            const data = {
                username: form.username.value.trim(),
                password: form.password.value,
            };

            try {
                const result = await apiPost('/api/users/login/', data);
                showToast('¡Bienvenido, ' + result.user.username + '!');
                window.location.href = '/';
            } catch (err) {
                renderErrors(errorsDiv, err.errors || { general: err.message || 'Error al iniciar sesión.' });
            } finally {
                setLoading(btn, false);
            }
        });
    })();
</script>
{% endblock %}
