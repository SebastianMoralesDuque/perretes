# pytest.ini
# Configuración central de pytest para el proyecto Perretes
# Uso: pytest (desde la raíz del proyecto)

[pytest]
DJANGO_SETTINGS_MODULE = perretes.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*

testpaths =
    apps/users/tests
    apps/barkposts/tests

addopts =
    --strict-markers
    --tb=short
    -v
    --color=yes

markers =
    unit: Tests unitarios rápidos (sin DB o con mocks)
    integration: Tests de integración que tocan la base de datos
    api: Tests de API HTTP (end-to-end del backend)
    slow: Tests lentos que se pueden saltar en desarrollo rápido
